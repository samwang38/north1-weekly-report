<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北一區週報產生器</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="eyebrow">WEEKLY REPORT GENERATOR</div>
      <h1>北一區週報產生器</h1>
    </header>

    <section class="card" id="configCard">
      <h2>設定</h2>
      <div class="form-row">
        <label for="weekEnd">週結束日期（週六）</label>
        <input type="date" id="weekEnd">
      </div>
      <p class="hint" id="weekRangeHint"></p>
      <div class="form-row" style="align-items:center;gap:8px;">
        <input type="checkbox" id="useFullMonth" style="width:auto;margin:0;">
        <label for="useFullMonth" style="margin:0;font-weight:normal;">月累積延伸到月底（本月/去年同期/年累積 用完整月）</label>
      </div>
      <div class="actions">
        <button class="primary-btn" id="generateBtn" type="button">產生週報</button>
      </div>
    </section>

    <section class="card" id="progressCard" hidden>
      <h2>產生進度</h2>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
      <p class="progress-label" id="progressLabel">準備中…</p>
      <div class="log-box" id="logBox"></div>
    </section>

    <section class="card" id="downloadCard" hidden>
      <h2>下載</h2>
      <p id="downloadInfo"></p>
      <button class="primary-btn" id="downloadBtn" type="button">下載 Excel</button>
      <button class="ghost-btn" id="resetBtn" type="button">重新產生</button>
    </section>

    <section class="card" id="errorCard" hidden>
      <h2>發生錯誤</h2>
      <p id="errorMsg" class="error-msg"></p>
      <button class="ghost-btn" id="retryBtn" type="button">重試</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
